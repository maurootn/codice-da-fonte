/* ---------- planejador para quem já tem conquistas ---------- */
/* where: "feito" | "menu" | "save" | "nova" */
function sv2(g){const s=S.save[g.key];if(!s.b)s.b={ch:-1,dif:2,fane:false};return s.b}
function okFrom(g,id,sv){if(!sv||sv.ch<0)return false;const lim=LIM[g.key][id];if(g.key==="d2"&&FANE_ONLY.includes(id)&&!sv.fane)return false;if(lim==="dif")return sv.dif>=DIFLV[g.key][id];if(lim===-1)return true;return sv.ch<=lim}
function whereFor(g,id){if(isDone(g,id))return "feito";if(LIM[g.key][id]==="m")return "menu";return okFrom(g,id,S.save[g.key])||okFrom(g,id,sv2(g))?"save":"nova"}
function plan(g){
  const P={feito:[],menu:[],save:[],nova:[]};
  g.ach.forEach(a=>P[whereFor(g,a[0])].push(a[0]));
  const sv=S.save[g.key];
  const novaNonDif=P.nova.filter(id=>LIM[g.key][id]!=="dif");
  const difMiss=P.nova.filter(id=>LIM[g.key][id]==="dif");
  const recs=[];
  if(P.nova.length){
    const needH=difMiss.includes("honour"),needT=g.key==="d1"?difMiss.includes("tact"):difMiss.includes("divine");
    const fane=g.key==="d2"&&novaNonDif.some(id=>FANE_ONLY.includes(id));
    if(g.key==="d2"){
      if(needH&&novaNonDif.length===0)recs.push(["Run de Honra direta","Só a história, em dupla com Lobo Solitário. Terminar em Honra libera também Divino e as dificuldades menores."]);
      else if(needH&&novaNonDif.length<=12)recs.push(["Uma única run em Honra",`Cobre as ${novaNonDif.length} conquistas de campanha que faltam e todas as de dificuldade (Honra libera as menores).`]);
      else if(needH)recs.push(["Run completa + Honra enxuta",`São ${novaNonDif.length} conquistas de campanha: faça-as numa run em ${needT?"Tático (libera Divino)":"Clássico"} e deixe a Honra só para terminar o jogo.`]);
      else if(novaNonDif.length)recs.push(["Uma run nova",`Em ${needT?"Tático":"Clássico ou Explorador"}, focada só nas ${novaNonDif.length} que faltam.`]);
      else if(needT)recs.push(["Run em Tático","Só para a conquista de dificuldade; pode ser rota direta."]);
      if(P.nova.includes("lastresort"))recs.push(["A Ilha do Último Recurso",prefs(g).lastResort==="C"?"Run C curta em Explorador: nunca passe de 2 pontos de Fonte e pare quando a conquista sair.":"Na run de Honra, sem passar de 2 pontos de Fonte."]);
      if(fane)recs.push(["Protagonista: Fane","Faltam conquistas que só saem com Fane como personagem principal."]);
    }else{
      if(needH&&novaNonDif.length>12)recs.push(["Campanha + Honra",`Faça as ${novaNonDif.length} de campanha numa run em ${prefs(g).runA==="tatico"?"Tático":"Clássico"} e a Honra numa rota direta (Honra também libera Mate com voracidade).`]);
      else if(needH)recs.push(["Run em Honra",novaNonDif.length?`Encaixe as ${novaNonDif.length} de campanha nela; a Honra também libera Mate com voracidade.`:"Rota direta, só para terminar no modo; libera também Mate com voracidade."]);
      else if(needT)recs.push(["Run em Tático",novaNonDif.length?`Junto com as ${novaNonDif.length} de campanha.`:"Rota direta."]);
      else if(novaNonDif.length)recs.push(["Uma run nova","Em qualquer dificuldade, focada só no que falta."]);
      if(P.nova.includes("madora"))recs.push(["Madora desde o início","Irmã misericordiosa exige ela no grupo desde Cyseal."]);
    }
    if(P.nova.includes("wolf")||P.save.includes("wolf"))recs.push(["Alcateia","Guarde um ponto de talento e pegue Lobo Solitário depois do chefe final."]);
  }
  return {P,recs,novaNonDif,sv};
}

/* ---------- importação do texto da Steam ---------- */
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim()}
function importSteam(g,text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const N=lines.map(norm);
  const dateRe=/(alcancad|desbloquead|unlocked|obtid)/i;
  let found=0,marked=0;
  g.ach.forEach(a=>{const names=[nm(g,a[0]),a[1]].map(norm);
    const i=N.findIndex(l=>names.includes(l));if(i<0)return;found++;
    const near=lines.slice(i+1,i+4).join(" ");
    if(dateRe.test(norm(near))){S.done[g.key][a[0]]=true;marked++}
  });
  return {found,marked};
}

function css(v){return getComputedStyle(document.body).getPropertyValue(v).trim()}
function drawSeal(key){
  const cv=document.getElementById("cv-"+key);if(!cv)return;const x=cv.getContext("2d"),w=cv.width,c=w/2;x.clearRect(0,0,w,w);
  const a=css(key==="d1"?"--d1":"--d2"),b=css(key==="d1"?"--d1b":"--d2b"),line=css("--line");
  x.lineWidth=3;x.strokeStyle=line;x.beginPath();x.arc(c,c,c-4,0,Math.PI*2);x.stroke();
  if(key==="d1"){x.fillStyle=a;x.beginPath();for(let i=0;i<16;i++){const r=i%2?16:40,t=i*Math.PI/8-Math.PI/2;x.lineTo(c+r*Math.cos(t),c+r*Math.sin(t))}x.closePath();x.fill();x.fillStyle=b;x.beginPath();x.arc(c,c,9,0,Math.PI*2);x.fill();}
  else{const gr=x.createRadialGradient(c,c,4,c,c,34);gr.addColorStop(0,b);gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.beginPath();x.arc(c,c,34,0,Math.PI*2);x.fill();
    x.strokeStyle=a;x.lineWidth=7;x.beginPath();x.arc(c,c,30,Math.PI*.15,Math.PI*1.85);x.stroke();
    x.fillStyle=a;for(let i=0;i<6;i++){const t=Math.PI*.15+i*(Math.PI*1.7/5);x.beginPath();x.arc(c+30*Math.cos(t),c+30*Math.sin(t),6,0,Math.PI*2);x.fill()}
    x.fillStyle=b;x.beginPath();x.moveTo(c,c-12);x.lineTo(c+8,c);x.lineTo(c,c+12);x.lineTo(c-8,c);x.closePath();x.fill();}
}
